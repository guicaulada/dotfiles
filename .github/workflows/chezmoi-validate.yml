name: chezmoi-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Run full workstation bootstrap on the disposable runner
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: brew install chezmoi shellcheck

      - name: Validate rendered templates
        run: python3 scripts/validate-dotfiles.py

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Seed chezmoi config
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << 'EOF'
          [data]
            name = "test"
            email = "test@example.com"
            is_work = false
            company = ""
            work_email = ""
          EOF

      - name: Initialize and apply
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE" --no-tty
          chezmoi apply --source="$GITHUB_WORKSPACE" --no-tty --force
